name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'gnosis-kaksha/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time; a push during a deploy waits instead of killing a half-done build.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build and restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_ACCOUNTANT_PASSWORD: ${{ secrets.TEST_ACCOUNTANT_PASSWORD }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
        with:
          envs: TEST_ADMIN_PASSWORD,TEST_ACCOUNTANT_PASSWORD,TEST_TEACHER_PASSWORD,TEST_STUDENT_PASSWORD
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 25m
          # Runs the deploy script from origin/main, so script changes apply on the same push.
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch -q origin main
            git show origin/main:./deploy/scripts/deploy.sh > /tmp/gnosis-deploy.sh
            bash /tmp/gnosis-deploy.sh "$PWD"
