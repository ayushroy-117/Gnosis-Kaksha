# /etc/nginx/sites-available/gnosiskaksha.cloud
# Only the Next.js app is public. The Supabase API gateway and Postgres stay on
# 127.0.0.1 (see deploy/supabase/docker-compose.override.yml); the app talks to
# them server-side, so the browser never needs the Supabase URL.
#
# Issue the certificate after enabling this file:
#   certbot --nginx -d gnosiskaksha.cloud -d www.gnosiskaksha.cloud
# certbot rewrites this file to add the 443 server block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name gnosiskaksha.cloud www.gnosiskaksha.cloud;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
