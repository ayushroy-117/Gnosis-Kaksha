# /etc/nginx/sites-available/gnosiskaksha (as deployed). Issue certs with:
#   certbot certonly --webroot -w /var/www/html -d gnosiskaksha.in -d www.gnosiskaksha.in
# Gnosis Kaksha — primary domain gnosiskaksha.in; gnosiskaksha.cloud is retired
# and permanently redirects here (old links and QR codes keep working).

# gnosiskaksha.in — the app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gnosiskaksha.in www.gnosiskaksha.in;

    ssl_certificate /etc/letsencrypt/live/gnosiskaksha.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gnosiskaksha.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # www -> bare domain
    if ($host = www.gnosiskaksha.in) {
        return 301 https://gnosiskaksha.in$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# gnosiskaksha.in over plain HTTP -> HTTPS (certificate renewals still served)
server {
    listen 80;
    listen [::]:80;
    server_name gnosiskaksha.in www.gnosiskaksha.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://gnosiskaksha.in$request_uri; }
}

# gnosiskaksha.cloud (retired) -> gnosiskaksha.in, keeping the path
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gnosiskaksha.cloud www.gnosiskaksha.cloud;
    ssl_certificate /etc/letsencrypt/live/gnosiskaksha.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gnosiskaksha.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://gnosiskaksha.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name gnosiskaksha.cloud www.gnosiskaksha.cloud;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://gnosiskaksha.in$request_uri; }
}
