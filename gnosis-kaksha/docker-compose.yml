services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: gnosis-kaksha:latest
    container_name: gnosis-kaksha-app
    restart: unless-stopped
    # Localhost only: Nginx on the host terminates TLS and proxies here.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Joins the self-hosted Supabase stack's network so the server can reach
    # the API gateway at http://api-gw:8000 (set SUPABASE_URL to that).
    networks:
      - default
      - supabase
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  supabase:
    external: true
    name: supabase_default
